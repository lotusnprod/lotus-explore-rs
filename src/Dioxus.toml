[application]
name = "lotus-explore-rs"
default_platform = "web"
asset_dir = "public"
# Note: dx ≥ 0.7 writes the web bundle to
#   target/dx/<package-name>/release/web/public/
# and ignores any `out_dir` key set here.

[[hooks]]
# Compile Tailwind (token theme + scanned Rust utilities) before each dx build.
# Pin the CLI to an exact version so the committed lotus-explore.css stays
# byte-identical to dx's build output. Unpinned `npx` fetches LATEST, which
# drifts the generated CSS across builds (this is what caused the committed
# file and the build output to disagree). dx 0.7 has no built-in auto-tailwind,
# so this pre-build hook is the required 0.7 path.
stage = "pre-build"
command = "npx @tailwindcss/cli@4.3.3 -i ./tailwind/styles.css -o ./public/assets/lotus-explore.css --minify"

[web]
pre_compress = true

[web.app]
title = "LOTUS Linked Open Data Explorer"

[web.watcher]
reload_html = true
watch_path = ["src", "public", "tailwind", "../crates/lotus/src"]

[[web.proxy]]
# Proxy API requests to the in-package server backend to avoid CORS issues in development
path = "/v1"
backend = "http://127.0.0.1:8787/v1"

[web.serve]
# Ensures correct MIME types are emitted locally
asset_dir = "public"
