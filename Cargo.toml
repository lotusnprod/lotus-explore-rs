[workspace]
resolver = "2"
members = [
  "apps/lotus-explore-rs",
  "crates/lotus",
  "crates/lotus-deploy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"

[workspace.dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
console_log = "1.1"
dioxus = { version = "=0.7.10", features = ["web"] }
env_logger = "0.11"
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }
futures = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
log = "0.4"
reqwest = { version = "0.13", features = ["gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1", features = ["net", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "fs", "request-id", "trace"] }
tracing = "0.1"
urlencoding = "2.1"
utoipa = "5"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = {
  version = "0.3",
  features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "File",
    "HtmlAnchorElement",
    "HtmlCollection",
    "HtmlElement",
    "HtmlFormElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "Location",
    "MediaQueryList",
    "Performance",
    "Url",
    "Window",
  ]
}
zip = "8.6"

[workspace.lints.clippy]
# All clippy lints (core lints)
all = { level = "deny", priority = -1 }

# Clippy pedantic lints (additional quality checks)
pedantic = { level = "deny", priority = -2 }

# Clippy nursery lints (experimental, may be noisy)
nursery = { level = "warn", priority = -3 }

# Clippy cargo lints (Cargo.toml hygiene)
# Note: multiple_crate_versions is allow-listed due to transitive deps from dioxus
cargo = { level = "warn", priority = -1 }

expect_used = "warn"
indexing_slicing = "deny"
panic = "warn"
todo = "deny"
unimplemented = "deny"
# Selectively enable valuable restriction lints
# These catch real quality issues and are defensible
unwrap_used = "deny"

# Allow multiple_crate_versions due to transitive deps from dioxus ecosystem
multiple_crate_versions = "allow"

[workspace.lints.rust]
# Dead code - warn for visibility issues, but Dioxus cross-cfg requires allowance
# in the main app where UI/WASM code is unreachable from native builds
dead_code = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "deny"
unsafe_code = "forbid"
unused_crate_dependencies = "warn"
unused_must_use = "warn"

[profile.release]
debug = false
debug-assertions = false
overflow-checks = false
lto = "thin"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
