[package]
name = "lotus"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "LOTUS domain models, SPARQL query construction, and result parsing for Wikidata/QLever"
license = "AGPL-3.0-only"
keywords = ["lotus", "natural-products", "sparql", "wasm", "wikidata"]
categories = ["science", "web-programming"]
publish = false

[dependencies]
bytes = "1.12"
csv = "1.4"
log = "0.4"
sha2 = { version = "0.11", default-features = false }
urlencoding = "2.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", features = ["gzip"] }
tempfile = "3.27"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
reqwest = { version = "0.13", features = [] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window"] }

[lints]
workspace = true
