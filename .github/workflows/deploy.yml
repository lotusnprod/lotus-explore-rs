name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 1 }

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: lotus-explore-rs-cargo-${{ hashFiles('**/Cargo.lock') }}
          prefix-key: lotus-explore-rs-cargo-

      - uses: docker/setup-buildx-action@056599cea480f7a2e9c1a484b594d9f019c2a2a3

      - name: Build webapp with Docker (fetches Ketcher + dx build)
        run: |
          rm -rf _final_site
          mkdir -p _final_site
          docker buildx build \
            --target export \
            --output "_final_site" .

      - name: Verify Ketcher assets
        run: |
          ls _final_site/assets/ketcher/
          test -f _final_site/assets/ketcher/index.html

      - uses: actions/upload-pages-artifact@fc364d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _final_site

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
