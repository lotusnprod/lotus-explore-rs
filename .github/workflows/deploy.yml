name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 1 }

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: lotus-explore-rs-cargo-${{ hashFiles('**/Cargo.lock') }}
          prefix-key: lotus-explore-rs-cargo-

      - uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli --version 0.7.10 --locked --no-confirm

      - name: Fetch Ketcher
        run: cargo run --release -p lotus-deploy --bin fetch-ketcher
        working-directory: apps/lotus-explore-rs

      - name: Build App
        run: |
          REPONAME="${GITHUB_REPOSITORY#*/}"
          dx build --release --platform web --debug-symbols false --base-path "/${REPONAME}" --package lotus-explore-rs
        working-directory: apps/lotus-explore-rs

      - name: Stage Site Assets
        shell: bash -e {0}
        run: |
          mkdir -p _final_site

          # dx build runs from apps/lotus-explore-rs/ but may emit the web bundle
          # to either the workspace-root target/ or the crate-local target/.
          if [ -d "target/dx/lotus-explore-rs/release/web/public" ]; then
            cp -r target/dx/lotus-explore-rs/release/web/public/* _final_site/
          elif [ -d "apps/lotus-explore-rs/target/dx/lotus-explore-rs/release/web/public" ]; then
            cp -r apps/lotus-explore-rs/target/dx/lotus-explore-rs/release/web/public/* _final_site/
          else
            echo "::error::dx build output directory not found"
            exit 1
          fi

          # Verify Ketcher assets are present in the staged site
          if [ -d "_final_site/assets/ketcher" ]; then
            echo "✓ Ketcher assets present:"
            ls -la _final_site/assets/ketcher/
          else
            echo "::error::Ketcher assets not found in staged site"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _final_site

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
